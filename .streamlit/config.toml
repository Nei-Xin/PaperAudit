[theme]
base = "light"
primaryColor = "#1E4A7A"
backgroundColor = "#F4F4F2"
secondaryBackgroundColor = "#F0EFEC"
textColor = "#1A1A19"
borderColor = "#E7E5E1"
linkColor = "#1E4A7A"
baseRadius = "8px"
font = "sans serif"
headingFont = "sans serif"
codeFont = "monospace"

[theme.sidebar]
backgroundColor = "#F4F4F2"
secondaryBackgroundColor = "#E9E8E5"

[client]
toolbarMode = "minimal"

[server]
headless = true
