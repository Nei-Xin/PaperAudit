[project]
name = "hy3-paperaudit"
version = "1.0.0"
description = "Claim-level evidence auditing for AI paper reports using Hy3"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=1.0,<2",
    "openai>=1.99,<3",
    "pydantic>=2.11,<3",
    "pymupdf>=1.26,<2",
    "python-pptx>=1.0,<2",
    "python-dotenv>=1.1,<2",
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "python-multipart>=0.0.20,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/paperaudit"]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8.4,<10",
]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]
